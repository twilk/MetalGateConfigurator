<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBT Metal Gate Configurator</title>
  <link rel="icon" href="favicon.ico">
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Three.js from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.142.0/examples/js/loaders/RGBELoader.js"></script>
  <!-- jsPDF from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="three-canvas"></canvas>
  <div id="ui-container">
    <div class="card">
      <h2>Parametry bramy</h2>
      <div id="parameters"></div>
    </div>
    <div class="card">
      <h2>Kosztorys</h2>
      <div id="cost-display" class="cost-display"></div>
    </div>
  </div>
  
  <div id="tools-panel">
    <div class="card">
      <h2>Import/Export</h2>
      <div class="tool-buttons">
        <button id="import-btn" class="tool-btn">
          <span class="icon">📂</span>
          Import projektu
        </button>
        <button id="export-btn" class="tool-btn">
          <span class="icon">💾</span>
          Export projektu
        </button>
      </div>
    </div>
    
    <div class="card">
      <h2>Dokumentacja</h2>
      <div class="tool-buttons">
        <button id="pdf-btn" class="tool-btn">
          <span class="icon">📄</span>
          Generuj PDF
        </button>
        <button id="specs-btn" class="tool-btn">
          <span class="icon">📋</span>
          Specyfikacja
        </button>
        <button id="drawings-btn" class="tool-btn">
          <span class="icon">📐</span>
          Rysunki techniczne
        </button>
        <button id="run-tests-btn" class="tool-btn">
          <span class="icon">🧪</span>
          Uruchom testy
        </button>
      </div>
    </div>
  </div>
  
  <!-- Bundled script -->
  <script src="bundle.js"></script>
  <!-- Tests -->
  <script src="tests.js"></script>
</body>
</html>
